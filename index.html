<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王船文化館｜團體導覽預約申請</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pri:#6B1D1D;--pri-mid:#8B2E2E;--pri-lt:#B84444;--gold:#C4A35A;--gold-lt:#E8D5A0;--bg:#F7F5F0;--surface:#fff;--surface-2:#FAFAF7;--text:#1C1C1C;--text-2:#555;--text-3:#999;--border:#E5E0D8;--border-2:#D5CFC5;--ok:#1B7A4A;--ok-bg:#E8F5EE;--warn:#A67C00;--warn-bg:#FFF8E8;--danger:#C0392B;--danger-bg:#FEF0EE;--r:20px;--r-sm:12px;--r-xs:8px;--shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow:0 2px 8px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.08),0 20px 48px rgba(0,0,0,.06)}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.hero{position:relative;background:linear-gradient(160deg,#3D0C0C 0%,var(--pri) 35%,var(--pri-mid) 60%,var(--pri-lt) 100%);padding:4rem 1.5rem 5rem;text-align:center;overflow:hidden}
.hero-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hero-deco .circle{position:absolute;border-radius:50%;border:1px solid rgba(196,163,90,.12)}
.hero-deco .c1{width:400px;height:400px;top:-180px;right:-100px}.hero-deco .c2{width:250px;height:250px;bottom:-80px;left:-60px}.hero-deco .c3{width:150px;height:150px;top:30%;left:10%;border-color:rgba(255,255,255,.05)}
.hero-deco .line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(196,163,90,.15),transparent)}
.hero-deco .l1{width:60%;top:30%;left:20%}.hero-deco .l2{width:40%;bottom:35%;right:10%}
.hero-content{position:relative;z-index:1}
.hero-sub{font-size:.78rem;letter-spacing:.5em;color:var(--gold);margin-bottom:.6rem;font-weight:400}
.hero-title{font-family:'Noto Serif TC',serif;font-size:2.6rem;font-weight:900;color:#fff;letter-spacing:.1em;line-height:1.3;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero-desc{font-size:.9rem;color:rgba(255,255,255,.55);margin-top:.8rem;font-weight:300;letter-spacing:.06em}
.hero-wave{position:absolute;bottom:-1px;left:0;right:0;z-index:2}
.hero-wave svg{display:block;width:100%;height:auto}
.main-wrap{max-width:820px;margin:0 auto;padding:0 1rem 5rem}
.query-bar{display:flex;justify-content:center;padding:1.8rem 0 .5rem}
.query-bar a{display:inline-flex;align-items:center;gap:.4rem;color:var(--pri);font-size:.85rem;cursor:pointer;text-decoration:none;padding:.55rem 1.6rem;border:1.5px solid rgba(107,29,29,.25);border-radius:50px;transition:all .3s;font-weight:500;background:rgba(255,255,255,.6);backdrop-filter:blur(4px)}
.query-bar a:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.query-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.8rem;margin:0 0 1rem;box-shadow:var(--shadow)}
.query-panel.open{display:block;animation:slideDown .35s ease}
.query-panel h3{font-family:'Noto Serif TC',serif;font-size:1.05rem;margin-bottom:1.2rem;color:var(--text)}
.query-input-row{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap}
.query-input-row .field{flex:1;min-width:180px}
.query-input-row .btn-query{height:42px;padding:0 1.8rem;background:var(--pri);color:#fff;border:none;border-radius:var(--r-xs);font-size:.88rem;cursor:pointer;font-weight:500;transition:all .25s;font-family:'Noto Sans TC',sans-serif}
.query-input-row .btn-query:hover{background:var(--pri-lt)}
.query-input-row .btn-query:disabled{background:#bbb;cursor:not-allowed}
.query-result{margin-top:1rem}
.query-empty{color:var(--text-3);font-size:.88rem;padding:.8rem 0}
.notice-wrap{padding:1.5rem 0}
.notice{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem 1.8rem;font-size:.85rem;line-height:2;color:var(--text-2);position:relative;box-shadow:var(--shadow-sm)}
.notice::before{content:'📋';position:absolute;top:-14px;left:20px;background:var(--bg);padding:0 .5rem;font-size:1.1rem}
.notice strong{color:var(--pri);font-weight:600}
.form-flow{position:relative;padding:1rem 0 0}
.step-section{position:relative;padding-left:3.5rem;padding-bottom:2rem}
.step-section::before{content:'';position:absolute;left:17px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--border-2),var(--border))}
.step-section:last-of-type::before{display:none}
.step-marker{position:absolute;left:4px;top:2px;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-family:'Noto Serif TC',serif;font-size:.75rem;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:1;box-shadow:0 2px 8px rgba(107,29,29,.3);transition:transform .3s}
.step-section:hover .step-marker{transform:scale(1.1)}
.step-label{font-family:'Noto Serif TC',serif;font-size:1.1rem;font-weight:600;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.step-label small{font-size:.78rem;color:var(--text-3);font-weight:400;font-family:'Noto Sans TC',sans-serif}
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.6rem;box-shadow:var(--shadow);transition:box-shadow .3s}
.step-card:hover{box-shadow:var(--shadow-lg)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 1.4rem}
.field-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-size:.82rem;font-weight:500;color:var(--text-2)}
.req{color:var(--danger);font-weight:600}.opt{font-size:.74rem;color:var(--text-3);font-weight:300;margin-left:2px}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:var(--r-xs);padding:.6rem .9rem;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;color:var(--text);background:var(--surface);transition:all .2s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(107,29,29,.08)}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--border-2)}
.field textarea{resize:vertical;min-height:80px}
.field-hint{font-size:.78rem;color:var(--warn);background:var(--warn-bg);border-radius:var(--r-xs);padding:6px 10px;margin-top:3px;line-height:1.5}
.error-msg{font-size:.78rem;color:var(--danger);margin-top:3px;display:none}
.field.invalid input,.field.invalid select{border-color:var(--danger);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.field.invalid .error-msg{display:block}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.2rem}
.product-card{border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);transition:all .35s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.product-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.product-card.selected{border-color:var(--pri);box-shadow:0 0 0 2px rgba(107,29,29,.12),var(--shadow)}
.product-card.out-of-stock{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.product-img-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.product-img{width:100%;height:100%;object-fit:contain;display:block;padding:8px;transition:transform .4s}
.product-card:hover .product-img{transform:scale(1.04)}
.product-img-placeholder{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,var(--surface-2),var(--bg));display:flex;align-items:center;justify-content:center;font-size:2.8rem}
.product-info{padding:1rem;display:flex;flex-direction:column;flex:1}
.product-name{font-family:'Noto Serif TC',serif;font-size:.95rem;font-weight:600;margin-bottom:.3rem}
.product-desc{font-size:.78rem;color:var(--text-3);line-height:1.6;margin-bottom:.5rem;white-space:pre-line}
.product-price{font-size:.95rem;color:var(--pri);font-weight:600;margin-bottom:.5rem}
.product-bottom{margin-top:auto}
.stock-badge{display:inline-flex;align-items:center;font-size:.72rem;padding:3px 10px;border-radius:20px;margin-bottom:.6rem;font-weight:500}
.stock-ok{background:var(--ok-bg);color:var(--ok)}.stock-low{background:var(--warn-bg);color:var(--warn)}.stock-out{background:var(--danger-bg);color:var(--danger)}
.qty-row{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.qty-btn{width:32px;height:32px;border:1.5px solid var(--border);border-radius:var(--r-xs);background:var(--surface);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.qty-btn:hover{background:var(--bg);border-color:var(--border-2)}
.qty-btn:active{transform:scale(.9)}
.qty-num{min-width:28px;text-align:center;font-size:1rem;font-weight:600}
.qty-label{font-size:.75rem;color:var(--text-3)}
.skeleton{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.skeleton-img{width:100%;aspect-ratio:4/3;background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-body{padding:.9rem;display:flex;flex-direction:column;gap:.6rem}
.skeleton-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-line.short{width:55%}
@keyframes shimmer{to{background-position:-200% 0}}
.order-summary{background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:var(--r-sm);padding:1.1rem 1.3rem;margin-top:1.4rem;font-size:.88rem}
.summary-row{display:flex;justify-content:space-between;padding:4px 0;color:var(--text-2)}
.summary-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:8px;border-top:2px solid var(--border);font-weight:700;font-size:1rem;color:var(--pri)}
.checklist{display:flex;flex-direction:column;gap:.6rem}
.check-item{display:flex;gap:.8rem;align-items:flex-start;font-size:.85rem;line-height:1.7;color:var(--text-2);cursor:pointer;padding:.6rem .8rem;border-radius:var(--r-xs);border:1px solid transparent;transition:all .2s}
.check-item:hover{background:var(--surface-2);border-color:var(--border)}
.check-item input[type="checkbox"]{margin-top:5px;flex-shrink:0;accent-color:var(--pri);width:16px;height:16px}
.submit-wrap{text-align:center;padding:1.5rem 0 0}
.btn-submit{background:linear-gradient(135deg,var(--pri) 0%,var(--pri-lt) 100%);color:#fff;font-family:'Noto Serif TC',serif;font-size:1.05rem;font-weight:600;letter-spacing:.12em;padding:1rem 4rem;border:none;border-radius:50px;cursor:pointer;transition:all .35s;box-shadow:0 4px 20px rgba(107,29,29,.25);position:relative;overflow:hidden}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(107,29,29,.35)}
.btn-submit:active{transform:translateY(0)}
.btn-submit:disabled{background:#bbb;box-shadow:none;cursor:not-allowed;transform:none}
#success-screen{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4rem 2rem;text-align:center;margin:2rem 0;box-shadow:var(--shadow-lg)}
.success-icon{font-size:3.5rem;margin-bottom:1rem}
.success-title{font-family:'Noto Serif TC',serif;font-size:1.5rem;font-weight:600;color:var(--ok);margin-bottom:.8rem}
.success-desc{font-size:.9rem;color:var(--text-2);line-height:1.9}
.success-ref{font-size:.82rem;color:var(--text-3);margin-top:1rem;padding:.5rem 1.2rem;background:var(--surface-2);border-radius:50px;display:inline-block}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(6px);z-index:999;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-box{background:var(--surface);border-radius:var(--r);padding:2rem 2.5rem;text-align:center;font-family:'Noto Serif TC',serif;color:var(--pri);box-shadow:var(--shadow-lg)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--pri);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto .8rem}
@keyframes spin{to{transform:rotate(360deg)}}
.booking-card{border:1px solid var(--border);border-radius:var(--r-sm);padding:1.2rem;margin-bottom:.8rem;background:var(--surface);transition:all .2s;box-shadow:var(--shadow-sm)}
.booking-card:hover{box-shadow:var(--shadow)}
.booking-card-header{margin-bottom:.5rem}
.booking-ref{font-family:'Noto Serif TC',serif;font-weight:600;color:var(--pri);font-size:.92rem}
.booking-detail{font-size:.83rem;color:var(--text-2);line-height:1.8}
.booking-actions{margin-top:.8rem}
.btn-cancel{background:transparent;border:1.5px solid var(--danger);color:var(--danger);padding:.35rem 1.1rem;border-radius:50px;font-size:.82rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .2s;font-weight:500}
.btn-cancel:hover{background:var(--danger);color:#fff}
.cancel-verify{margin-top:.7rem;padding:1rem;background:var(--warn-bg);border:1px solid rgba(196,163,90,.2);border-radius:var(--r-sm);display:none}
.cancel-verify.open{display:block;animation:slideDown .3s ease}
.cancel-verify .field{margin-bottom:.6rem}
.cancel-verify .field input{width:100%;border:1.5px solid var(--border);border-radius:var(--r-xs);padding:.5rem .7rem;font-size:.85rem;font-family:'Noto Sans TC',sans-serif;transition:border-color .2s}
.cancel-verify .field input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(107,29,29,.08)}
.cancel-btns{display:flex;gap:.5rem;margin-top:.7rem}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.footer-accent{height:4px;background:linear-gradient(90deg,var(--bg),var(--gold),var(--pri),var(--gold),var(--bg));margin-top:2rem;border-radius:2px}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.field-grid{grid-template-columns:1fr}.field-full{grid-column:1}.products-grid{grid-template-columns:1fr 1fr}.hero-title{font-size:1.8rem}.hero{padding:3rem 1rem 4rem}.step-section{padding-left:2.8rem}.step-card{padding:1.2rem}.main-wrap{padding:0 .8rem 4rem}}
</style>
</head>
<body>
<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzQCZbfAFEMtKWLhdcVBhVSJbyWlNH3l652ZKuXgTFeyWHynI8gbPYj2jayFfh5-lm4Eg/exec';
</script>

<header class="hero">
  <div class="hero-deco"><div class="circle c1"></div><div class="circle c2"></div><div class="circle c3"></div><div class="line l1"></div><div class="line l2"></div></div>
  <div class="hero-content">
    <div class="hero-sub" id="s-banner_subtitle">&nbsp;</div>
    <h1 class="hero-title" id="s-banner_title">&nbsp;</h1>
    <p class="hero-desc" id="s-banner_desc">&nbsp;</p>
  </div>
  <div class="hero-wave"><svg viewBox="0 0 1440 80" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0 40C360 80 720 0 1080 40C1260 60 1380 50 1440 40L1440 80H0Z" fill="var(--bg)"/></svg></div>
</header>

<div class="main-wrap" id="form-area" style="opacity:0;transition:opacity .5s">
  <div class="query-bar"><a onclick="toggleQuery()">🔍 查詢／取消預約紀錄</a></div>
  <div class="query-panel" id="query-panel">
    <h3>📋 查詢預約紀錄</h3>
    <div class="query-input-row">
      <div class="field"><label>申請單位</label><input type="text" id="query-org" placeholder="請輸入您填表時的申請單位名稱"></div>
      <button class="btn-query" id="btn-query" onclick="doQuery()">查詢</button>
    </div>
    <div class="query-result" id="query-result"></div>
  </div>

  <div class="notice-wrap reveal"><div class="notice" id="s-notice"><div style="text-align:center;color:var(--text-3);padding:.5rem 0">載入中…</div></div></div>

  <div class="form-flow">
    <div class="step-section reveal">
      <div class="step-marker">1</div>
      <div class="step-label">導覽預約資料</div>
      <div class="step-card">
        <div class="field-grid">
          <div class="field"><label>預約日期 <span class="req">*</span></label><input type="date" id="tour-date"><span class="error-msg">請填寫預約日期</span></div>
          <div class="field"><label>導覽開始時間 <span class="req">*</span></label><select id="tour-start"><option value="">請選擇時間</option></select><span class="error-msg">請選擇導覽開始時間</span></div>
          <div class="field"><label>預計離館時間 <span class="opt">（選填）</span></label><select id="tour-end"><option value="">請選擇時間</option></select></div>
          <div class="field"><label>預計人數 <span class="req">*</span></label><input type="number" id="pax" min="1" placeholder="請輸入人數"><div class="field-hint" id="s-pax_hint">&nbsp;</div><span class="error-msg">請填寫人數</span></div>
          <div class="field field-full"><label>申請單位 <span class="req">*</span></label><input type="text" id="org" placeholder="學校 / 機關 / 企業名稱"><span class="error-msg">請填寫申請單位</span></div>
          <div class="field"><label>聯絡人姓名 <span class="req">*</span></label><input type="text" id="contact-name"><span class="error-msg">請填寫聯絡人姓名</span></div>
          <div class="field"><label>聯絡人電話 <span class="req">*</span></label><input type="tel" id="contact-phone" placeholder="09xx-xxxxxx 或市話"><span class="error-msg">請填寫聯絡人電話</span></div>
          <div class="field"><label>領團人姓名 <span class="opt">（選填）</span></label><input type="text" id="leader-name"></div>
          <div class="field"><label>領團人電話 <span class="opt">（選填）</span></label><input type="tel" id="leader-phone"></div>
          <div class="field field-full"><label>其他需求</label><textarea id="remarks" placeholder="如有特殊需求、無障礙需求或其他事項，請在此說明"></textarea></div>
        </div>
      </div>
    </div>

    <div class="step-section reveal" id="step-products">
      <div class="step-marker">2</div>
      <div class="step-label">伴手禮 ／ 餐食預訂 <small>（選填）</small></div>
      <div class="step-card">
        <p style="font-size:.83rem;color:var(--text-3);margin-bottom:1.2rem;">預先選購，將由專人聯繫接洽。本館無預先收款，僅做備貨，確定購買再下單，非常感謝。</p>
        <div class="products-grid" id="products-grid">
          <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
          <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
          <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
        </div>
        <div class="order-summary" id="order-summary" style="display:none">
          <div id="summary-items"></div>
          <div class="summary-total"><span>合計金額（供參考，現場付款）</span><span id="summary-total-price">NT$0</span></div>
        </div>
      </div>
    </div>

    <div class="step-section reveal">
      <div class="step-marker">3</div>
      <div class="step-label">重要須知確認 <small>（請逐項閱讀並勾選）</small></div>
      <div class="step-card">
        <div class="checklist">
          <label class="check-item"><input type="checkbox" class="must-check"><span id="s-check1"></span></label>
          <label class="check-item"><input type="checkbox" class="must-check"><span id="s-check2"></span></label>
          <label class="check-item"><input type="checkbox" class="must-check"><span id="s-check3"></span></label>
          <label class="check-item"><input type="checkbox" class="must-check"><span id="s-check4"></span></label>
        </div>
        <div id="check-error" style="display:none;color:var(--danger);font-size:.82rem;margin-top:.6rem;">請勾選所有重要須知後才能送出</div>
      </div>
    </div>
  </div>

  <div class="submit-wrap reveal"><button class="btn-submit" id="btn-submit" onclick="submitForm()">送出申請表單</button></div>
  <div class="footer-accent"></div>
</div>

<div class="main-wrap">
  <div id="success-screen">
    <div class="success-icon">✅</div>
    <div class="success-title">申請表單已成功送出</div>
    <div class="success-desc" id="s-success_desc"></div>
    <div class="success-ref" id="success-ref"></div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="loading-box"><div class="spinner"></div>正在送出申請，請稍候…</div>
</div>

<script>
function buildTime(id,minH,minM,maxH,maxM){const sel=document.getElementById(id);for(let h=minH;h<=maxH;h++){for(let m=0;m<=45;m+=15){if(h===minH&&m<minM)continue;if(h===maxH&&m>maxM)continue;const v=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;sel.innerHTML+=`<option value="${v}">${v}</option>`;}}}
buildTime('tour-start',9,0,15,45);buildTime('tour-end',9,0,18,0);
let PRODUCTS=[],inventory={},quantities={};
const observer=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target);}});},{threshold:0.12,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

function applySettings(s){
  const set=(id,val)=>{const el=document.getElementById('s-'+id);if(el&&val!==undefined&&val!==null)el.textContent=val;};
  set('banner_subtitle',s.banner_subtitle);set('banner_title',s.banner_title);set('banner_desc',s.banner_desc);
  set('pax_hint',s.pax_hint);set('check1',s.check1);set('check2',s.check2);set('check3',s.check3);set('check4',s.check4);
  if(s.success_desc){const el=document.getElementById('s-success_desc');if(el) el.innerHTML=s.success_desc.replace(/\n/g,'<br>');}
  if(s.notice){const el=document.getElementById('s-notice');if(el) el.innerHTML=s.notice.replace(/\n/g,'<br>');}
  // 隱藏伴手禮區塊
  if(s.hide_products==='1'){const el=document.getElementById('step-products');if(el)el.style.display='none';}
  // 套用自訂配色
  const root=document.documentElement.style;
  const colorMap={color_pri:'--pri',color_pri_lt:'--pri-lt',color_gold:'--gold',color_bg:'--bg',color_surface:'--surface',color_text:'--text'};
  Object.entries(colorMap).forEach(([key,cssVar])=>{
    if(s[key]&&/^#[0-9a-fA-F]{6}$/.test(s[key])) root.setProperty(cssVar,s[key]);
  });
  // 套用個別文字顏色
  const txtColorMap={color_banner_sub:'s-banner_subtitle',color_banner_title:'s-banner_title',color_banner_desc:'s-banner_desc',color_notice:'s-notice'};
  Object.entries(txtColorMap).forEach(([key,elId])=>{
    if(s[key]&&/^#[0-9a-fA-F]{6}$/.test(s[key])){const el=document.getElementById(elId);if(el)el.style.color=s[key];}
  });
}

async function fetchAll(){
  try{
    const[pr,sr]=await Promise.all([fetch(APPS_SCRIPT_URL+'?action=products').then(r=>r.json()),fetch(APPS_SCRIPT_URL+'?action=settings').then(r=>r.json())]);
    if(sr.settings) applySettings(sr.settings);
    document.getElementById('form-area').style.opacity='1';
    if(pr.products&&pr.products.length){PRODUCTS=pr.products;PRODUCTS.forEach(p=>{inventory[p.id]=p.stock;quantities[p.id]=0;});renderProducts();}
    else{document.getElementById('products-grid').innerHTML='<p style="color:var(--text-3);font-size:.85rem;">目前無商品資料。</p>';}
  }catch(e){document.getElementById('form-area').style.opacity='1';document.getElementById('products-grid').innerHTML='<p style="color:var(--text-3);font-size:.85rem;">商品資料載入失敗，請重新整理頁面。</p>';}
}

function renderProducts(){
  const grid=document.getElementById('products-grid');grid.innerHTML='';
  PRODUCTS.forEach(p=>{
    const stock=inventory[p.id]??0,qty=quantities[p.id]??0;
    const sc=stock<=0?'stock-out':stock<=5?'stock-low':'stock-ok';
    const st=stock<=0?'已售完':stock<=5?`剩餘 ${stock} 份`:'庫存充足';
    grid.innerHTML+=`<div class="product-card ${qty>0?'selected':stock<=0?'out-of-stock':''}" id="card-${p.id}">${p.img?`<div class="product-img-wrap"><img class="product-img" src="${p.img}" alt="${p.name}" onerror="this.closest('.product-img-wrap').outerHTML='<div class=product-img-placeholder>${p.icon||'🎁'}</div>'"></div>`:`<div class="product-img-placeholder">${p.icon||'🎁'}</div>`}<div class="product-info"><div class="product-name">${p.name}</div><div class="product-desc">${(p.desc||'').replace(/\n/g,'<br>')}</div><div class="product-bottom"><div class="product-price">NT$ ${Number(p.price).toLocaleString()} ／份</div><span class="stock-badge ${sc}">${st}</span><div class="qty-row"><button class="qty-btn" onclick="changeQty('${p.id}',-1)">－</button><div class="qty-num" id="qty-${p.id}">${qty}</div><button class="qty-btn" onclick="changeQty('${p.id}',1)">＋</button><span class="qty-label">份</span></div></div></div></div>`;
  });
}

function changeQty(id,d){quantities[id]=Math.max(0,Math.min(inventory[id]??0,(quantities[id]??0)+d));document.getElementById(`qty-${id}`).textContent=quantities[id];document.getElementById(`card-${id}`).className=`product-card ${quantities[id]>0?'selected':inventory[id]<=0?'out-of-stock':''}`;updateSummary();}

function updateSummary(){const items=PRODUCTS.filter(p=>quantities[p.id]>0);const s=document.getElementById('order-summary');if(!items.length){s.style.display='none';return;}s.style.display='block';let total=0,html='';items.forEach(p=>{const sub=p.price*quantities[p.id];total+=sub;html+=`<div class="summary-row"><span>${p.name} × ${quantities[p.id]}</span><span>NT$ ${sub.toLocaleString()}</span></div>`;});document.getElementById('summary-items').innerHTML=html;document.getElementById('summary-total-price').textContent=`NT$ ${total.toLocaleString()}`;}

function validateForm(){const fields=[{id:'tour-date',msg:'請填寫預約日期'},{id:'tour-start',msg:'請選擇導覽開始時間'},{id:'pax',msg:'請填寫人數',check:v=>parseInt(v)>=1},{id:'org',msg:'請填寫申請單位'},{id:'contact-name',msg:'請填寫聯絡人姓名'},{id:'contact-phone',msg:'請填寫聯絡人電話'},];let ok=true;fields.forEach(f=>{const el=document.getElementById(f.id);const valid=el.value.trim()&&(!f.check||f.check(el.value));el.closest('.field').classList.toggle('invalid',!valid);if(!valid)ok=false;});const allChecked=[...document.querySelectorAll('.must-check')].every(c=>c.checked);document.getElementById('check-error').style.display=allChecked?'none':'block';return ok&&allChecked;}

async function submitForm(){
  if(!validateForm()){document.querySelector('.field.invalid')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
  document.getElementById('loading').classList.add('show');document.getElementById('btn-submit').disabled=true;
  const payload={tourDate:document.getElementById('tour-date').value,tourStart:document.getElementById('tour-start').value,tourEnd:document.getElementById('tour-end').value,pax:document.getElementById('pax').value,org:document.getElementById('org').value,contactName:document.getElementById('contact-name').value,contactPhone:document.getElementById('contact-phone').value,leaderName:document.getElementById('leader-name').value,leaderPhone:document.getElementById('leader-phone').value,remarks:document.getElementById('remarks').value,items:PRODUCTS.filter(p=>quantities[p.id]>0).map(p=>({id:p.id,name:p.name,qty:quantities[p.id],price:p.price})),};
  try{const postBody=JSON.stringify({action:'submit',...payload});let result;try{const r=await fetch(APPS_SCRIPT_URL,{method:'POST',body:postBody});const text=await r.text();try{result=JSON.parse(text);}catch(x){result={success:true};}}catch(e1){const url=APPS_SCRIPT_URL+'?action=submit&data='+encodeURIComponent(JSON.stringify(payload));const r2=await fetch(url);try{result=await r2.json();}catch(x){result={success:true};}}
  document.getElementById('loading').classList.remove('show');document.getElementById('form-area').style.display='none';document.getElementById('success-screen').style.display='block';document.getElementById('success-ref').textContent='申請編號（參考用）：'+(result.ref||'REF-'+Date.now().toString().slice(-6));window.scrollTo({top:0,behavior:'smooth'});}catch(e){document.getElementById('loading').classList.remove('show');document.getElementById('btn-submit').disabled=false;alert('送出失敗，請檢查網路連線或聯絡館方。錯誤：'+e.message);}
}

function toggleQuery(){document.getElementById('query-panel').classList.toggle('open');}

async function doQuery(){
  const org=document.getElementById('query-org').value.trim();if(!org){alert('請輸入申請單位名稱');return;}
  const btn=document.getElementById('btn-query');const box=document.getElementById('query-result');btn.disabled=true;btn.textContent='查詢中…';box.innerHTML='';
  try{const url=APPS_SCRIPT_URL+'?action=queryBookings&data='+encodeURIComponent(JSON.stringify({org}));const r=await fetch(url);const data=await r.json();btn.disabled=false;btn.textContent='查詢';
  if(!data.success){box.innerHTML=`<p class="query-empty">${data.error||'查詢失敗'}</p>`;return;}
  const list=data.bookings||[];if(!list.length){box.innerHTML='<p class="query-empty">查無未來的預約紀錄。</p>';return;}
  box.innerHTML=list.map(b=>{const dateStr=formatDate(b.tourDate);const timeStr=formatTime(b.tourStart)+(b.tourEnd?' ～ '+formatTime(b.tourEnd):'');const itemsHtml=b.items&&b.items!=='（無）'?`<div style="margin-top:.3rem">🎁 ${b.items}<br>預訂金額：NT$ ${Number(b.total).toLocaleString()}</div>`:'';
  return `<div class="booking-card" id="bk-${b.ref}"><div class="booking-card-header"><span class="booking-ref">${b.ref}</span></div><div class="booking-detail">📅 ${dateStr}　${timeStr}<br>👥 ${b.pax} 人${itemsHtml}</div><div class="booking-actions"><button class="btn-cancel" onclick="showCancelForm('${b.ref}')">取消此預約</button></div><div class="cancel-verify" id="cv-${b.ref}"><div style="font-size:.82rem;color:var(--text-2);margin-bottom:.5rem">請輸入預約時填寫的聯絡人資料以驗證身分：</div><div class="field"><label style="font-size:.78rem;color:var(--text-2)">聯絡人姓名</label><input type="text" id="cn-${b.ref}" placeholder="請輸入完整姓名"></div><div class="field"><label style="font-size:.78rem;color:var(--text-2)">聯絡人電話</label><input type="tel" id="cp-${b.ref}" placeholder="請輸入電話號碼"></div><div class="cancel-btns"><button class="btn-cancel" onclick="doCancel('${b.ref}')" id="cb-${b.ref}">確認取消</button><button style="background:transparent;border:1.5px solid var(--border);padding:.35rem 1rem;border-radius:50px;font-size:.82rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;color:var(--text-2)" onclick="hideCancelForm('${b.ref}')">返回</button></div></div></div>`;}).join('');}catch(e){btn.disabled=false;btn.textContent='查詢';box.innerHTML='<p class="query-empty">查詢失敗，請稍後再試。</p>';}
}

function formatDate(d){if(!d)return'—';if(typeof d==='string'&&/^\d{4}\/\d{2}\/\d{2}$/.test(d))return d;const dt=new Date(d);if(isNaN(dt.getTime()))return d;return`${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;}
function formatTime(t){if(!t)return'';if(typeof t==='string'&&/^\d{2}:\d{2}$/.test(t))return t;const dt=new Date(t);if(isNaN(dt.getTime()))return String(t);return`${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;}
function maskName(n){if(!n||n.length<=1)return n||'';return n[0]+'○'.repeat(n.length-1);}
function maskPhone(p){if(!p||p.length<=4)return p||'';return p.slice(0,3)+'****'+p.slice(-2);}
function showCancelForm(ref){document.getElementById('cv-'+ref).classList.add('open');}
function hideCancelForm(ref){document.getElementById('cv-'+ref).classList.remove('open');}

async function doCancel(ref){
  const name=document.getElementById('cn-'+ref).value.trim();const phone=document.getElementById('cp-'+ref).value.trim();
  if(!name||!phone){alert('請輸入聯絡人姓名和電話');return;}if(!confirm('確定要取消此預約（'+ref+'）嗎？取消後無法復原。'))return;
  const btn=document.getElementById('cb-'+ref);btn.disabled=true;btn.textContent='處理中…';
  try{const body=JSON.stringify({action:'cancelBooking',ref,contactName:name,contactPhone:phone});let result;
  try{const r=await fetch(APPS_SCRIPT_URL,{method:'POST',body});const text=await r.text();try{result=JSON.parse(text);}catch(x){result={success:false,error:'回應格式錯誤'};}}catch(e1){const url=APPS_SCRIPT_URL+'?action=cancelBooking&data='+encodeURIComponent(JSON.stringify({ref,contactName:name,contactPhone:phone}));const r2=await fetch(url);result=await r2.json();}
  btn.disabled=false;btn.textContent='確認取消';if(result.success){const card=document.getElementById('bk-'+ref);card.style.opacity='.4';card.innerHTML='<div style="text-align:center;padding:1rem;color:var(--ok);font-weight:500">✅ 此預約已成功取消</div>';}else{alert(result.error||'取消失敗，請確認資料是否正確');}}catch(e){btn.disabled=false;btn.textContent='確認取消';alert('取消失敗，請稍後再試。');}
}

fetchAll();
</script>
</body>
</html>
