<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王船文化館｜後台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#8B1A1A;--red-lt:#C0392B;--gold:#C9A84C;--gold-lt:#F0D080;--paper:#F3ECD8;--cream:#FAF6EF;--ink:#2C1810;--ink-2:#5C3D2E;--ink-3:#8B6954;--border:#D4B896;--white:#fff;--ok:#2D6A4F;--ok-lt:#D8F3DC}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center}
.login-icon{font-size:2.5rem;margin-bottom:.8rem}
.login-title{font-family:'Noto Serif TC',serif;font-size:1.2rem;color:var(--red);margin-bottom:1.5rem}
.login-box input{width:100%;border:1px solid var(--border);border-radius:5px;padding:.6rem .8rem;font-size:.95rem;font-family:'Noto Sans TC',sans-serif;margin-bottom:.8rem}
.login-box input:focus{outline:none;border-color:var(--red)}
.btn{padding:.6rem 1.5rem;border:none;border-radius:5px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;font-weight:500;transition:background .2s}
.btn-primary{background:var(--red);color:var(--gold-lt)}
.btn-primary:hover{background:var(--red-lt)}
.btn-full{width:100%}
.btn-sm{padding:.35rem .9rem;font-size:.82rem}
.btn-danger{background:#dc3545;color:#fff}
.btn-danger:hover{background:#b02a37}
.btn-secondary{background:var(--paper);color:var(--ink-2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.login-err{color:var(--red);font-size:.82rem;margin-top:.5rem;display:none}
#admin-screen{display:none}
.topbar{background:var(--red);color:var(--gold-lt);padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-family:'Noto Serif TC',serif;font-size:1rem;letter-spacing:.08em}
.topbar-right{font-size:.8rem;color:var(--gold);cursor:pointer}
.tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--border)}
.tab{padding:.75rem 1.4rem;cursor:pointer;font-size:.9rem;color:var(--ink-2);border-bottom:3px solid transparent;transition:all .2s}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.tab:hover:not(.active){background:rgba(0,0,0,.04)}
.panel{display:none;padding:1.5rem;max-width:900px;margin:0 auto}
.panel.active{display:block}
.product-list{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1.5rem}
.product-row{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:.9rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.product-thumb{width:56px;height:56px;border-radius:5px;flex-shrink:0;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden}
.product-thumb img{width:100%;height:100%;object-fit:cover}
.product-meta{flex:1;min-width:120px}
.product-meta-name{font-weight:500;font-size:.95rem;margin-bottom:2px}
.product-meta-sub{font-size:.78rem;color:var(--ink-3)}
.product-stock{font-size:.82rem;color:var(--ok);background:var(--ok-lt);padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.product-actions{display:flex;gap:.5rem;flex-shrink:0}
.form-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.form-card h3{font-family:'Noto Serif TC',serif;font-size:.95rem;color:var(--red);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1.2rem}
.form-full{grid-column:1/-1}
.form-field{display:flex;flex-direction:column;gap:.3rem}
.form-field label{font-size:.78rem;font-weight:500;color:var(--ink-2)}
.form-field input,.form-field textarea{border:1px solid var(--border);border-radius:5px;padding:.45rem .65rem;font-size:.88rem;font-family:'Noto Sans TC',sans-serif;color:var(--ink);width:100%}
.form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--red)}
.form-field textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;gap:.6rem;margin-top:1rem;justify-content:flex-end}
.settings-section{margin-bottom:1.5rem}
.settings-section h3{font-family:'Noto Serif TC',serif;font-size:.95rem;color:var(--red);margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.settings-field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.8rem}
.settings-field label{font-size:.78rem;font-weight:500;color:var(--ink-2)}
.settings-field input,.settings-field textarea{border:1px solid var(--border);border-radius:5px;padding:.45rem .65rem;font-size:.88rem;font-family:'Noto Sans TC',sans-serif;color:var(--ink);width:100%}
.settings-field input:focus,.settings-field textarea:focus{outline:none;border-color:var(--red)}
.settings-field textarea{resize:vertical;min-height:75px}
.color-row{display:flex;gap:.5rem;align-items:center;padding:.4rem .6rem;background:var(--paper);border:1px solid var(--border);border-radius:5px;margin-top:4px}
.color-pick{width:32px;height:32px;border:2px solid var(--border);border-radius:6px;padding:1px;cursor:pointer;flex-shrink:0;background:var(--white)}
.color-text{width:90px;border:1px solid var(--border);border-radius:4px;padding:.3rem .5rem;font-size:.82rem;font-family:'Noto Sans TC',sans-serif;color:var(--ink);text-align:center;flex-shrink:0}
.color-text:focus{outline:none;border-color:var(--red)}
.color-reset{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:.25rem .5rem;font-size:.72rem;color:var(--ink-3);cursor:pointer;white-space:nowrap;font-family:'Noto Sans TC',sans-serif;flex-shrink:0}
.color-reset:hover{background:var(--paper);color:var(--ink-2)}
.color-label{font-size:.75rem;color:var(--ink-3);white-space:nowrap;flex-shrink:0}
.toggle-row{display:flex;align-items:center;gap:.6rem;cursor:pointer;padding:.7rem 1rem;border-radius:6px;border:1px solid var(--border);background:var(--white)}
.toggle-row:hover{background:var(--paper)}
.toggle-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--red);flex-shrink:0}
.toggle-label{font-size:.88rem;font-weight:500;color:var(--ink)}
.toggle-hint{font-size:.75rem;color:var(--ink-3)}
.color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.color-item{display:flex;flex-direction:column;gap:.3rem}
.color-item label{font-size:.78rem;font-weight:500;color:var(--ink-2)}
.color-item .color-inner{display:flex;gap:.4rem;align-items:center}
.color-item .color-pick{width:36px;height:30px}
.color-item .color-text{flex:1;width:auto;text-align:left}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.7rem 1.2rem;border-radius:6px;font-size:.88rem;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}.toast.ok{background:var(--ok);color:#fff}.toast.err{background:#dc3545;color:#fff}
.spinner-sm{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.notif-section{margin-bottom:2rem}
.notif-section h3{font-family:'Noto Serif TC',serif;font-size:.95rem;color:var(--red);margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
.notif-section h3 .badge{background:var(--red);color:var(--gold-lt);font-size:.72rem;padding:1px 7px;border-radius:10px;font-family:'Noto Sans TC',sans-serif}
.notif-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:.9rem 1rem;margin-bottom:.7rem;display:flex;align-items:flex-start;gap:.8rem}
.notif-card.type-cancel{border-left:3px solid #dc3545}
.notif-card.type-new{border-left:3px solid var(--ok)}
.notif-check{margin-top:3px;flex-shrink:0;accent-color:var(--red);width:17px;height:17px;cursor:pointer}
.notif-body{flex:1;font-size:.85rem;color:var(--ink-2);line-height:1.7}
.notif-ref{font-family:'Noto Serif TC',serif;font-weight:700;color:var(--ink);font-size:.88rem}
.notif-tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:10px;margin-left:.4rem;vertical-align:middle}
.tag-new{background:var(--ok-lt);color:var(--ok)}
.tag-cancel{background:#F8D7DA;color:#721C24}
.notif-empty{color:var(--ink-3);font-size:.88rem;padding:1rem 0;text-align:center}
.notif-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.5rem}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}.form-full{grid-column:1}.color-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<script>
const API='https://script.google.com/macros/s/AKfycbzQCZbfAFEMtKWLhdcVBhVSJbyWlNH3l652ZKuXgTFeyWHynI8gbPYj2jayFfh5-lm4Eg/exec';
</script>

<!-- 登入 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">⚙️</div>
    <div class="login-title">王船文化館 後台管理</div>
    <input type="password" id="pw-input" placeholder="請輸入管理密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err" id="login-err">密碼錯誤，請重試</div>
  </div>
</div>

<!-- 後台 -->
<div id="admin-screen">
  <div class="topbar">
    <div class="topbar-title">⚙️ 王船文化館 後台管理</div>
    <div class="topbar-right" onclick="logout()">登出</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('notifications')">預約通知</div>
    <div class="tab" onclick="switchTab('products')">商品管理</div>
    <div class="tab" onclick="switchTab('settings')">頁面文字</div>
  </div>

  <!-- 預約通知 -->
  <div class="panel active" id="panel-notifications">
    <div id="notif-loading" style="color:var(--ink-3);font-size:.9rem;padding:1rem 0">載入通知中…</div>
    <div id="notif-content" style="display:none">
      <div class="notif-section" id="notif-new-section">
        <h3>📥 新預約 <span class="badge" id="notif-new-count">0</span></h3>
        <div id="notif-new-list"></div>
        <div class="notif-actions" id="notif-new-actions" style="display:none">
          <button class="btn btn-primary btn-sm" id="btn-confirm-new" onclick="confirmChecked('new')">儲存已勾選</button>
        </div>
      </div>
      <div class="notif-section" id="notif-cancel-section">
        <h3>📤 取消預約 <span class="badge" id="notif-cancel-count">0</span></h3>
        <div id="notif-cancel-list"></div>
        <div class="notif-actions" id="notif-cancel-actions" style="display:none">
          <button class="btn btn-primary btn-sm" id="btn-confirm-cancel" onclick="confirmChecked('cancel')">儲存已勾選</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 商品管理 -->
  <div class="panel" id="panel-products">
    <div style="margin-bottom:1rem">
      <button class="btn btn-primary btn-sm" onclick="openAddProduct()">＋ 新增商品</button>
    </div>
    <div id="products-loading" style="color:var(--ink-3);font-size:.9rem;padding:1rem 0">載入商品中…</div>
    <div class="product-list" id="product-list"></div>
    <div class="form-card" id="product-form" style="display:none">
      <h3 id="product-form-title">新增商品</h3>
      <div class="form-grid">
        <div class="form-field">
          <label>商品ID（英數字，例如 P007）</label>
          <input type="text" id="f-id" placeholder="P007">
        </div>
        <div class="form-field">
          <label>商品名稱</label>
          <input type="text" id="f-name" placeholder="例：東港黑鮪魚醬">
        </div>
        <div class="form-field">
          <label>價格（NT$）</label>
          <input type="number" id="f-price" placeholder="280">
        </div>
        <div class="form-field">
          <label>庫存數量</label>
          <input type="number" id="f-stock" placeholder="50">
        </div>
        <div class="form-field form-full">
          <label>商品描述</label>
          <textarea id="f-desc" placeholder="商品介紹文字…"></textarea>
        </div>
        <div class="form-field form-full">
          <label>圖片網址（留空使用備用圖示）</label>
          <input type="url" id="f-img" placeholder="https://...">
        </div>
        <div class="form-field">
          <label>備用圖示 Emoji（無圖片時顯示）</label>
          <input type="text" id="f-icon" placeholder="🎁">
        </div>
        <div class="form-field">
          <label>分類</label>
          <select id="f-type" style="border:1px solid var(--border);border-radius:5px;padding:.45rem .65rem;font-size:.88rem;font-family:'Noto Sans TC',sans-serif">
            <option value="souvenir">🎁 伴手禮</option>
            <option value="meal">🍱 餐食</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary btn-sm" onclick="closeProductForm()">取消</button>
        <button class="btn btn-primary btn-sm" id="save-product-btn" onclick="saveProduct()">儲存商品</button>
      </div>
    </div>
  </div>

  <!-- 頁面文字 -->
  <div class="panel" id="panel-settings">
    <div id="settings-loading" style="color:var(--ink-3);font-size:.9rem;padding:1rem 0">載入設定中…</div>
    <div id="settings-content" style="display:none">
      <div class="settings-section">
        <h3>⚙️ 功能開關</h3>
        <label class="toggle-row" style="margin-bottom:.5rem">
          <input type="checkbox" id="s-hide_souvenirs">
          <span class="toggle-label">隱藏「伴手禮」區塊</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="s-hide_meals">
          <span class="toggle-label">隱藏「餐食預訂」區塊</span>
        </label>
      </div>
      <div class="settings-section">
        <h3>頂部橫幅</h3>
        <div class="settings-field"><label>小標題（機構名稱）</label><input type="text" id="s-banner_subtitle"></div>
        <div class="settings-field"><label>大標題（館名）</label><input type="text" id="s-banner_title"></div>
        <div class="settings-field"><label>副標題</label><input type="text" id="s-banner_desc"></div>
        <div class="color-grid" style="margin-top:.8rem">
          <div class="color-item"><label>小標題顏色</label><div class="color-inner"><input type="color" id="s-color_banner_sub" value="#C4A35A" class="color-pick"><input type="text" id="s-color_banner_sub_text" class="color-text" value="#C4A35A"><button class="color-reset" onclick="resetColor('color_banner_sub','#C4A35A')">還原</button></div></div>
          <div class="color-item"><label>大標題顏色</label><div class="color-inner"><input type="color" id="s-color_banner_title" value="#FFFFFF" class="color-pick"><input type="text" id="s-color_banner_title_text" class="color-text" value="#FFFFFF"><button class="color-reset" onclick="resetColor('color_banner_title','#FFFFFF')">還原</button></div></div>
          <div class="color-item"><label>副標題顏色</label><div class="color-inner"><input type="color" id="s-color_banner_desc" value="#FFFFFF" class="color-pick"><input type="text" id="s-color_banner_desc_text" class="color-text" value="#FFFFFF"><button class="color-reset" onclick="resetColor('color_banner_desc','#FFFFFF')">還原</button></div></div>
        </div>
      </div>
      <div class="settings-section">
        <h3>申請須知</h3>
        <div class="settings-field"><label>每一條用換行分隔</label><textarea id="s-notice" style="min-height:150px"></textarea></div>
        <div class="color-grid" style="margin-top:.6rem">
          <div class="color-item"><label>須知文字顏色</label><div class="color-inner"><input type="color" id="s-color_notice" value="#555555" class="color-pick"><input type="text" id="s-color_notice_text" class="color-text" value="#555555"><button class="color-reset" onclick="resetColor('color_notice','#555555')">還原</button></div></div>
        </div>
      </div>
      <div class="settings-section">
        <h3>人數欄位提示文字</h3>
        <div class="settings-field"><textarea id="s-pax_hint" style="min-height:60px"></textarea></div>
      </div>
      <div class="settings-section">
        <h3>重要須知確認項目</h3>
        <div class="settings-field"><label>第1條</label><textarea id="s-check1" style="min-height:55px"></textarea></div>
        <div class="settings-field"><label>第2條</label><textarea id="s-check2" style="min-height:55px"></textarea></div>
        <div class="settings-field"><label>第3條</label><textarea id="s-check3" style="min-height:55px"></textarea></div>
        <div class="settings-field"><label>第4條</label><textarea id="s-check4" style="min-height:55px"></textarea></div>
      </div>
      <div class="settings-section">
        <h3>送出成功後的訊息</h3>
        <div class="settings-field"><textarea id="s-success_desc" style="min-height:80px"></textarea></div>
      </div>
      <div class="settings-section">
        <h3>🎨 頁面配色</h3>
        <div class="color-grid">
          <div class="color-item"><label>主色（橫幅、按鈕）</label><div class="color-inner"><input type="color" id="s-color_pri" value="#6B1D1D" class="color-pick"><input type="text" id="s-color_pri_text" class="color-text" value="#6B1D1D"><button class="color-reset" onclick="resetColor('color_pri','#6B1D1D')">還原</button></div></div>
          <div class="color-item"><label>主色-亮（漸層）</label><div class="color-inner"><input type="color" id="s-color_pri_lt" value="#B84444" class="color-pick"><input type="text" id="s-color_pri_lt_text" class="color-text" value="#B84444"><button class="color-reset" onclick="resetColor('color_pri_lt','#B84444')">還原</button></div></div>
          <div class="color-item"><label>金色裝飾</label><div class="color-inner"><input type="color" id="s-color_gold" value="#C4A35A" class="color-pick"><input type="text" id="s-color_gold_text" class="color-text" value="#C4A35A"><button class="color-reset" onclick="resetColor('color_gold','#C4A35A')">還原</button></div></div>
          <div class="color-item"><label>頁面背景</label><div class="color-inner"><input type="color" id="s-color_bg" value="#F7F5F0" class="color-pick"><input type="text" id="s-color_bg_text" class="color-text" value="#F7F5F0"><button class="color-reset" onclick="resetColor('color_bg','#F7F5F0')">還原</button></div></div>
          <div class="color-item"><label>卡片背景</label><div class="color-inner"><input type="color" id="s-color_surface" value="#FFFFFF" class="color-pick"><input type="text" id="s-color_surface_text" class="color-text" value="#FFFFFF"><button class="color-reset" onclick="resetColor('color_surface','#FFFFFF')">還原</button></div></div>
          <div class="color-item"><label>主要文字</label><div class="color-inner"><input type="color" id="s-color_text" value="#1C1C1C" class="color-pick"><input type="text" id="s-color_text_text" class="color-text" value="#1C1C1C"><button class="color-reset" onclick="resetColor('color_text','#1C1C1C')">還原</button></div></div>
        </div>
        <p style="font-size:.75rem;color:var(--ink-3);margin-top:.8rem">點擊色塊開啟調色盤，或直接輸入色碼。儲存後重新整理預約頁面即生效。</p>
      </div>
      <div style="text-align:right;margin-top:.5rem">
        <button class="btn btn-primary" id="save-settings-btn" onclick="saveSettings()">儲存所有設定</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminToken='';
let products=[];
let editingId=null;

function escapeHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── 登入（透過 API 驗證密碼，取得 token）──
async function doLogin(){
  const pw=document.getElementById('pw-input').value.trim();
  if(!pw){document.getElementById('login-err').style.display='block';return;}
  const btn=document.getElementById('login-btn');
  btn.disabled=true;btn.textContent='驗證中…';
  try{
    const r=await fetch(API+'?action=login&data='+encodeURIComponent(JSON.stringify({password:pw})));
    const text=await r.text();
    console.log('登入回應:', text);
    let data;
    try{data=JSON.parse(text);}catch(x){data=null;}
    btn.disabled=false;btn.textContent='登入';
    if(data&&data.success&&data.token){
      adminToken=data.token;
      document.getElementById('login-err').style.display='none';
      document.getElementById('login-screen').style.display='none';
      document.getElementById('admin-screen').style.display='block';
      loadNotifications();
    } else {
      const errMsg=data&&data.error?data.error:(data&&data.error==undefined&&!data.success?'API 回傳格式異常，請確認 Apps Script 已部署新版本':'密碼錯誤，請重試');
      document.getElementById('login-err').textContent=errMsg;
      document.getElementById('login-err').style.display='block';
    }
  }catch(e){
    btn.disabled=false;btn.textContent='登入';
    document.getElementById('login-err').textContent='連線失敗，請稍後再試';
    document.getElementById('login-err').style.display='block';
  }
}

function logout(){
  adminToken='';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('admin-screen').style.display='none';
  document.getElementById('pw-input').value='';
  document.getElementById('login-err').textContent='密碼錯誤，請重試';
}

// ── 分頁 ──
const TAB_ORDER=['notifications','products','settings'];
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',TAB_ORDER[i]===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='notifications') loadNotifications();
  if(tab==='settings') loadSettings();
  if(tab==='products') loadProducts();
}

// ── 商品 ──
async function loadProducts(){
  document.getElementById('products-loading').style.display='block';
  document.getElementById('product-list').innerHTML='';
  try{
    const res=await fetch(API+'?action=products');
    const data=await res.json();
    products=data.products||[];
    document.getElementById('products-loading').style.display='none';
    renderProductList();
  }catch(e){
    document.getElementById('products-loading').textContent='載入失敗，請重新整理。';
  }
}

function renderProductList(){
  const list=document.getElementById('product-list');
  if(!products.length){list.innerHTML='<p style="color:var(--ink-3);font-size:.88rem;">尚無商品，請點「新增商品」。</p>';return;}
  list.innerHTML='';
  products.forEach(p=>{
    const eImg=escapeHtml(p.img),eIcon=escapeHtml(p.icon||'🎁'),eName=escapeHtml(p.name),eId=escapeHtml(p.id);
    const thumb=p.img
      ?`<div class="product-thumb"><img src="${eImg}" onerror="this.outerHTML='<span>${eIcon}</span>'"></div>`
      :`<div class="product-thumb">${eIcon}</div>`;
    const typeBadge=p.type==='meal'?'<span style="font-size:.7rem;padding:1px 6px;border-radius:10px;background:#FFF3CD;color:#856404;margin-left:.4rem">餐食</span>':'<span style="font-size:.7rem;padding:1px 6px;border-radius:10px;background:#E8F5EE;color:#1B7A4A;margin-left:.4rem">伴手禮</span>';
    list.innerHTML+=`
      <div class="product-row">
        ${thumb}
        <div class="product-meta">
          <div class="product-meta-name">${eName}${typeBadge}</div>
          <div class="product-meta-sub">ID: ${eId} ｜ NT$${Number(p.price).toLocaleString()} ／份</div>
        </div>
        <span class="product-stock">庫存 ${p.stock}</span>
        <div class="product-actions">
          <button class="btn btn-secondary btn-sm" onclick="openEditProduct('${eId}')">編輯</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDelete('${eId}','${eName}')">刪除</button>
        </div>
      </div>`;
  });
}

function openAddProduct(){
  editingId=null;
  document.getElementById('product-form-title').textContent='新增商品';
  ['id','name','price','stock','desc','img','icon'].forEach(k=>document.getElementById('f-'+k).value='');
  document.getElementById('f-type').value='souvenir';
  document.getElementById('f-id').disabled=false;
  document.getElementById('product-form').style.display='block';
  document.getElementById('product-form').scrollIntoView({behavior:'smooth',block:'start'});
}

function openEditProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  editingId=id;
  document.getElementById('product-form-title').textContent='編輯商品';
  document.getElementById('f-id').value=p.id;document.getElementById('f-id').disabled=true;
  document.getElementById('f-name').value=p.name;document.getElementById('f-price').value=p.price;
  document.getElementById('f-stock').value=p.stock;document.getElementById('f-desc').value=p.desc;
  document.getElementById('f-img').value=p.img;document.getElementById('f-icon').value=p.icon;
  document.getElementById('f-type').value=p.type||'souvenir';
  document.getElementById('product-form').style.display='block';
  document.getElementById('product-form').scrollIntoView({behavior:'smooth',block:'start'});
}

function closeProductForm(){document.getElementById('product-form').style.display='none';}

async function saveProduct(){
  const id=editingId||document.getElementById('f-id').value.trim();
  if(!id||!document.getElementById('f-name').value.trim()){showToast('請填寫商品ID和名稱','err');return;}
  const btn=document.getElementById('save-product-btn');
  btn.innerHTML='<span class="spinner-sm"></span>儲存中…';btn.disabled=true;
  const res=await apiPost({action:'saveProduct',token:adminToken,id,
    name:document.getElementById('f-name').value,price:document.getElementById('f-price').value,
    stock:document.getElementById('f-stock').value,desc:document.getElementById('f-desc').value,
    img:document.getElementById('f-img').value,icon:document.getElementById('f-icon').value||'🎁',
    type:document.getElementById('f-type').value});
  btn.innerHTML='儲存商品';btn.disabled=false;
  if(res&&res.success){showToast('商品已儲存','ok');closeProductForm();loadProducts();}
  else showToast('儲存失敗，請重試','err');
}

async function confirmDelete(id,name){
  if(!confirm(`確定要刪除「${name}」嗎？`))return;
  const res=await apiPost({action:'deleteProduct',token:adminToken,id});
  if(res&&res.success){showToast('已刪除','ok');loadProducts();}
  else showToast('刪除失敗','err');
}

// ── 設定 ──
async function loadSettings(){
  document.getElementById('settings-loading').style.display='block';
  document.getElementById('settings-content').style.display='none';
  try{
    const res=await fetch(API+'?action=settings');
    const data=await res.json();
    document.getElementById('settings-loading').style.display='none';
    document.getElementById('settings-content').style.display='block';
    const s=data.settings||{};
    Object.entries(s).forEach(([k,v])=>{
      const el=document.getElementById('s-'+k);
      if(k==='hide_products'||k==='hide_souvenirs'||k==='hide_meals'){
        if(el) el.checked=(v==='1');
      } else if(el){
        el.value=v;
      }
      if(k.startsWith('color_')&&v){
        const pick=document.getElementById('s-'+k);
        const text=document.getElementById('s-'+k+'_text');
        if(pick)pick.value=v;
        if(text)text.value=v;
      }
    });
  }catch(e){document.getElementById('settings-loading').textContent='載入失敗，請重新整理。';}
}

async function saveSettings(){
  const keys=['banner_subtitle','banner_title','banner_desc','notice','pax_hint','check1','check2','check3','check4','success_desc'];
  const colorKeys=['color_pri','color_pri_lt','color_gold','color_bg','color_surface','color_text','color_banner_sub','color_banner_title','color_banner_desc','color_notice'];
  const settings={};
  keys.forEach(k=>{const el=document.getElementById('s-'+k);if(el)settings[k]=el.value;});
  colorKeys.forEach(k=>{const el=document.getElementById('s-'+k+'_text');if(el&&el.value.trim())settings[k]=el.value.trim();else settings[k]='';});
  // 功能開關
  settings.hide_souvenirs=document.getElementById('s-hide_souvenirs').checked?'1':'0';
  settings.hide_meals=document.getElementById('s-hide_meals').checked?'1':'0';
  const btn=document.getElementById('save-settings-btn');
  btn.innerHTML='<span class="spinner-sm"></span>儲存中…';btn.disabled=true;
  const res=await apiPost({action:'saveSettings',token:adminToken,settings});
  btn.innerHTML='儲存所有設定';btn.disabled=false;
  if(res&&res.success)showToast('設定已儲存，預約網頁會自動更新','ok');
  else showToast('儲存失敗：'+(res&&res.error?res.error:'請開瀏覽器 F12 Console 查看錯誤'),'err');
}

// ── API POST（使用 text/plain 繞過 CORS preflight）──
async function apiPost(body){
  try{
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
    const text = await res.text();
    try {
      const data = JSON.parse(text);
      // Token 過期自動登出
      if(data && data.error && data.error.includes('過期')){
        showToast('登入已過期，請重新登入','err');
        setTimeout(logout, 1500);
        return null;
      }
      return data;
    } catch(e) {
      if (res.ok || res.redirected) return { success: true };
      return null;
    }
  }catch(e){
    try {
      const url = API + '?action=' + body.action + '&data=' + encodeURIComponent(JSON.stringify(body));
      const res2 = await fetch(url);
      const text2 = await res2.text();
      return JSON.parse(text2);
    } catch(e2) { return null; }
  }
}

// ── Toast ──
let toastTimer;
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

// ── 預約通知 ──
let pendingBookings=[];

function fmtDate(d){
  if(!d) return '—';
  const dt=new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
}

function fmtDate(d){
  if(!d) return '—';
  if(typeof d==='string'&&/^\d{4}\/\d{2}\/\d{2}$/.test(d)) return d;
  const dt=new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtTime(t){
  if(!t) return '';
  if(typeof t==='string'&&/^\d{2}:\d{2}$/.test(t)) return t;
  const dt=new Date(t);
  if(isNaN(dt.getTime())) return String(t);
  return `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}
function fmtDT(d){
  if(!d) return '—';
  if(typeof d==='string'&&/^\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}$/.test(d)) return d;
  const dt=new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  return fmtDate(d)+' '+fmtTime(d);
}

async function loadNotifications(){
  document.getElementById('notif-loading').style.display='block';
  document.getElementById('notif-content').style.display='none';
  try{
    const data=await apiPost({action:'getPending',token:adminToken});
    document.getElementById('notif-loading').style.display='none';
    document.getElementById('notif-content').style.display='block';
    if(!data||!data.success){if(data)showToast(data.error||'載入失敗','err');return;}
    pendingBookings=data.bookings||[];
    renderNotifications();
  }catch(e){
    document.getElementById('notif-loading').textContent='載入失敗，請重新整理。';
  }
}

function renderNotifications(){
  const newList=pendingBookings.filter(b=>b.status==='正常');
  const cancelList=pendingBookings.filter(b=>b.status==='已取消');

  document.getElementById('notif-new-count').textContent=newList.length;
  document.getElementById('notif-cancel-count').textContent=cancelList.length;

  const newBox=document.getElementById('notif-new-list');
  const cancelBox=document.getElementById('notif-cancel-list');

  if(!newList.length){
    newBox.innerHTML='<div class="notif-empty">目前沒有待處理的新預約</div>';
    document.getElementById('notif-new-actions').style.display='none';
  } else {
    document.getElementById('notif-new-actions').style.display='flex';
    newBox.innerHTML=newList.map(b=>renderNotifCard(b,'new')).join('');
  }

  if(!cancelList.length){
    cancelBox.innerHTML='<div class="notif-empty">目前沒有待處理的取消通知</div>';
    document.getElementById('notif-cancel-actions').style.display='none';
  } else {
    document.getElementById('notif-cancel-actions').style.display='flex';
    cancelBox.innerHTML=cancelList.map(b=>renderNotifCard(b,'cancel')).join('');
  }
}

function renderNotifCard(b,type){
  const start=fmtTime(b.tourStart);
  const end=fmtTime(b.tourEnd);
  const timeRange=start+(end?' — '+end:'');
  const tag=type==='new'
    ?'<span class="notif-tag tag-new">新預約</span>'
    :'<span class="notif-tag tag-cancel">已取消</span>';
  const actionTime=type==='cancel'&&b.cancelTime
    ?`🕐 取消時間：${escapeHtml(fmtDT(b.cancelTime))}`
    :`🕐 送出時間：${escapeHtml(fmtDT(b.submitTime))}`;
  const itemsHtml=b.items&&b.items!=='（無）'
    ?`<br>🎁 ${escapeHtml(b.items)}<br>預訂金額：NT$ ${Number(b.total).toLocaleString()}`:'';
  const leaderHtml=b.leaderName
    ?`<br>👤 領團人：${escapeHtml(b.leaderName)}${b.leaderPhone?' / '+escapeHtml(b.leaderPhone):''}`:'';
  return `<div class="notif-card type-${type}">
    <input type="checkbox" class="notif-check" data-ref="${escapeHtml(b.ref)}" data-type="${type}">
    <div class="notif-body">
      <div><span class="notif-ref">${escapeHtml(b.ref)}</span>${tag}</div>
      ${actionTime}<br>
      🏢 ${escapeHtml(b.org)}　👥 ${b.pax} 人<br>
      📅 ${escapeHtml(fmtDate(b.tourDate))}　${escapeHtml(timeRange)}<br>
      📞 聯絡人：${escapeHtml(b.contactName)} / ${escapeHtml(b.contactPhone)}${leaderHtml}${itemsHtml}
    </div>
  </div>`;
}

async function confirmChecked(type){
  const checks=[...document.querySelectorAll(`.notif-check[data-type="${type}"]:checked`)];
  if(!checks.length){showToast('請先勾選要處理的項目','err');return;}
  const refs=checks.map(c=>c.dataset.ref);
  const btn=document.getElementById(type==='new'?'btn-confirm-new':'btn-confirm-cancel');
  btn.innerHTML='<span class="spinner-sm"></span>儲存中…';btn.disabled=true;
  const r=await apiPost({action:'confirmBookings',token:adminToken,refs:refs});
  btn.innerHTML='儲存已勾選';btn.disabled=false;
  if(r&&r.success){
    showToast(`已處理 ${refs.length} 筆`,'ok');
    loadNotifications();
  } else {
    showToast('儲存失敗：'+(r&&r.error?r.error:'請重試'),'err');
  }
}

// ── 色彩選擇器同步 ──
function resetColor(k,def){
  const pick=document.getElementById('s-'+k);
  const text=document.getElementById('s-'+k+'_text');
  if(pick)pick.value=def;
  if(text)text.value=def;
}
['color_pri','color_pri_lt','color_gold','color_bg','color_surface','color_text','color_banner_sub','color_banner_title','color_banner_desc','color_notice'].forEach(k=>{
  const pick=document.getElementById('s-'+k);
  const text=document.getElementById('s-'+k+'_text');
  if(pick&&text){
    pick.addEventListener('input',()=>{text.value=pick.value;});
    text.addEventListener('input',()=>{if(/^#[0-9a-fA-F]{6}$/.test(text.value))pick.value=text.value;});
  }
});
